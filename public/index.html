<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeCardHunter — Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>PokeCardHunter</h1>
        <p class="subtitle">Candidate listings found by the scan pipeline</p>
      </div>
      <div class="run-now-wrap">
        <button id="run-now" class="accent">Run Now</button>
        <span id="run-now-status" class="run-now-status"></span>
      </div>
    </div>
  </header>

  <details class="target-cards" id="target-cards" open>
    <summary>Target Cards</summary>
    <div class="target-cards-body">
      <table class="results-table target-cards-table">
        <thead>
          <tr>
            <th>Card</th>
            <th>Set</th>
            <th>Number</th>
            <th>Avg Price</th>
            <th>Range</th>
            <th>Listings</th>
            <th>Last Checked</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="target-cards-body"></tbody>
      </table>

      <form class="filters" id="add-card-form">
        <div class="field">
          <label for="new-card-name">Name</label>
          <input type="text" id="new-card-name" placeholder="Charizard ex" required />
        </div>
        <div class="field">
          <label for="new-card-set">Set</label>
          <input type="text" id="new-card-set" placeholder="Obsidian Flames" list="known-sets" required />
          <datalist id="known-sets"></datalist>
          <p id="set-suggestion" class="form-hint" hidden></p>
        </div>
        <div class="field">
          <label for="new-card-number">Number</label>
          <input type="text" id="new-card-number" placeholder="125/197" required />
        </div>
        <div class="field field-wide">
          <label for="new-card-aliases">Set aliases (optional, comma-separated)</label>
          <input type="text" id="new-card-aliases" placeholder="Mega Evolution, Mega Evolution Promo" />
        </div>
        <div class="field">
          <label for="new-card-currency">Currency</label>
          <select id="new-card-currency">
            <option value="GBP">GBP</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
          </select>
        </div>
        <div class="field field-actions">
          <button type="submit" id="add-card-submit">Add Card</button>
          <button type="button" id="add-card-cancel" class="secondary" hidden>Cancel</button>
        </div>
      </form>
      <p id="add-card-error" class="form-error" hidden></p>
    </div>
  </details>

  <div class="tabs" id="status-tabs">
    <button type="button" class="tab active" data-status="">All</button>
    <button type="button" class="tab" data-status="found">Found</button>
    <button type="button" class="tab" data-status="offered">Offered</button>
    <button type="button" class="tab" data-status="bought">Bought</button>
    <button type="button" class="tab" data-status="sold">Sold</button>
    <button type="button" class="tab" data-status="flipped">Flipped</button>
  </div>

  <section class="filters" id="filters">
    <div class="field">
      <label for="filter-card">Card</label>
      <select id="filter-card"><option value="">All cards</option></select>
    </div>
    <div class="field">
      <label for="filter-set">Set</label>
      <select id="filter-set"><option value="">All sets</option></select>
    </div>
    <div class="field">
      <label for="filter-alerted">Alerted</label>
      <select id="filter-alerted">
        <option value="">All</option>
        <option value="1">Alerted only</option>
        <option value="0">Not alerted</option>
      </select>
    </div>
    <div class="field">
      <label for="filter-date-from">Found from</label>
      <input type="date" id="filter-date-from" />
    </div>
    <div class="field">
      <label for="filter-date-to">Found to</label>
      <input type="date" id="filter-date-to" />
    </div>
    <div class="field">
      <label for="filter-price-min">Min price</label>
      <input type="number" id="filter-price-min" placeholder="0" min="0" step="0.01" />
    </div>
    <div class="field">
      <label for="filter-price-max">Max price</label>
      <input type="number" id="filter-price-max" placeholder="999" min="0" step="0.01" />
    </div>
    <div class="field">
      <label for="filter-min-margin">Min margin %</label>
      <input type="number" id="filter-min-margin" placeholder="0" min="0" max="100" step="1" />
    </div>
    <div class="field field-actions">
      <button id="apply-filters">Apply</button>
      <button id="clear-filters" class="secondary">Clear</button>
    </div>
  </section>

  <p id="results-count" class="results-count"></p>

  <table class="results-table" id="results-table">
    <thead>
      <tr>
        <th class="sortable" data-sort="card_name">Card<span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="listing_price">Listing Price<span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="target_price">Market Avg<span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="margin">Margin<span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="found_at">Found<span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="status">Status<span class="sort-indicator"></span></th>
        <th>Listing</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>

  <p id="empty-state" class="empty-state" hidden>No candidates match these filters.</p>

  <script src="app.js"></script>
</body>
</html>
